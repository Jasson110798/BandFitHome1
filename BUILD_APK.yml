name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/services/food_ai_service.dart

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name bandfit_home \
              --org com.bandfithome \
              .
          fi

      - name: Add Android Internet and Camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('ERROR: AndroidManifest.xml does not exist')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          required = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          if marker not in text:
              raise SystemExit('ERROR: manifest header not found')
          missing = [x for x in required if x not in text]
          if missing:
              text = text.replace(marker, marker + '\n    ' + '\n    '.join(missing), 1)
              manifest.write_text(text)
          print(manifest.read_text())
          PY

      - name: Verify Android permissions
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          echo 'OK: INTERNET and CAMERA permissions are present.'

      - name: Install packages
        run: flutter pub get

      - name: Verify Gemini API key exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'ERROR: GEMINI_API_KEY secret is missing.'
            exit 1
          fi
          echo 'OK: GEMINI_API_KEY is present.'

      - name: Test Gemini API before APK build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          HTTP_CODE=$(curl -sS \
            -o /tmp/gemini_models.json \
            -w '%{http_code}' \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000' \
            -H "x-goog-api-key: $GEMINI_API_KEY")

          echo "Gemini models endpoint HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo 'Gemini API test failed:'
            cat /tmp/gemini_models.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/gemini_models.json'))
          models = []
          for item in data.get('models', []):
              methods = item.get('supportedGenerationMethods', [])
              if 'generateContent' in methods:
                  name = item.get('name', '')
                  if name.startswith('models/'):
                      name = name[7:]
                  if 'gemini' in name and 'flash' in name and 'image' not in name and 'tts' not in name and 'live' not in name:
                      models.append(name)
          print('Available Flash generateContent models:', ', '.join(models[:12]))
          if not models:
              raise SystemExit('ERROR: No Gemini Flash model supports generateContent for this API key.')
          PY

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandFitHome-v1.3.3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
