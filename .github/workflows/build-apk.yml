name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Flutter project structure
        run: |
          cat > pubspec.yaml <<'EOF'
          name: bandfit_home
          description: Resistance band home workout and AI food calorie app.
          publish_to: 'none'
          version: 1.1.0+2

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.5.3
            image_picker: ^1.1.2
            http: ^1.5.0

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib

          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi

          for folder in data models screens services theme widgets
          do
            if [ -d "$folder" ]; then
              mv "$folder" lib/
            fi
          done

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name bandfit_home \
            --org com.bandfithome \
            .

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          replacement = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>'''

          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, replacement)

          p.write_text(s)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandFitHome-v1.1-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
